services:
  app:
    build: .
    env_file:
      - .env.local
    volumes:
      - ./Mert_Incesu_Resume.pdf:/app/public/Mert_Incesu_Resume.pdf:ro
      - ./portrait.jpg:/app/public/portrait.jpg:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
